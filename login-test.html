<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GINA登录测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-group { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 3px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
        .run-test { background-color: #007bff; color: white; }
    </style>
</head>
<body>
    <h1>GINA牌友会 - 登录功能测试</h1>
    
    <div class="test-group">
        <h3>服务器状态测试</h3>
        <button class="run-test" onclick="testServerConnection()">测试服务器连接</button>
        <div id="server-result"></div>
    </div>
    
    <div class="test-group">
        <h3>创建房间测试</h3>
        <input type="text" id="test-name" placeholder="玩家名字" value="测试玩家">
        <button class="run-test" onclick="testCreateRoom()">创建房间</button>
        <div id="create-result"></div>
    </div>
    
    <div class="test-group">
        <h3>加入房间测试</h3>
        <input type="text" id="join-name" placeholder="玩家名字" value="第二个玩家">
        <input type="text" id="room-code" placeholder="房间号" value="">
        <button class="run-test" onclick="testJoinRoom()">加入房间</button>
        <div id="join-result"></div>
    </div>
    
    <script>
        async function showResult(elementId, message, isSuccess) {
            const element = document.getElementById(elementId);
            element.className = `result ${isSuccess ? 'success' : 'error'}`;
            element.textContent = message;
            element.style.display = 'block';
        }
        
        async function testServerConnection() {
            try {
                const response = await fetch('http://localhost:8769/');
                if (response.ok) {
                    showResult('server-result', '✅ 服务器连接正常', true);
                } else {
                    showResult('server-result', '❌ 服务器响应异常', false);
                }
            } catch (error) {
                showResult('server-result', `❌ 无法连接到服务器: ${error.message}`, false);
            }
        }
        
        async function testCreateRoom() {
            try {
                const name = document.getElementById('test-name').value;
                const response = await fetch('http://localhost:8769/api/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: name,
                        password: 'gina'
                    })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    showResult('create-result', `✅ 创建房间成功！房间号: ${data.state.code}`, true);
                    document.getElementById('room-code').value = data.state.code;
                } else {
                    showResult('create-result', `❌ 创建房间失败: ${data.error}`, false);
                }
            } catch (error) {
                showResult('create-result', `❌ 创建房间出错: ${error.message}`, false);
            }
        }
        
        async function testJoinRoom() {
            try {
                const name = document.getElementById('join-name').value;
                const code = document.getElementById('room-code').value;
                
                if (!code) {
                    showResult('join-result', '❌ 请先创建房间或输入房间号', false);
                    return;
                }
                
                const response = await fetch('http://localhost:8769/api/join', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: name,
                        code: code,
                        password: 'gina'
                    })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    showResult('join-result', '✅ 加入房间成功！', true);
                } else {
                    showResult('join-result', `❌ 加入房间失败: ${data.error}`, false);
                }
            } catch (error) {
                showResult('join-result', `❌ 加入房间出错: ${error.message}`, false);
            }
        }
        
        // 页面加载时自动测试服务器连接
        window.onload = testServerConnection;
    </script>
</body>
</html>
